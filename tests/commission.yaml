# The commissioning contract of keel-mariadb (handbook decision 0075).
# bin/keel-commission of Keel-Linux/.github reads it. It makes a container
# from the template as an operator does, answers the first boot (or
# preseeds it with the instance below), and proves each password by a
# login with it. A new first boot question or secret is a change of this
# file in the same pull request.
#
# The manifest of keel-mariadb has no modes key, so it takes the three
# modes of its base, Keel Core (0076): simple, cloud simple and cloud
# advanced. So the image runs all five passes: lxc-interactive,
# lxc-preseed, vm-iso, cloud_simple and cloud_advanced.
contract: 1
appliance: mariadb
secrets: [root, db]
# The prompts are the titles that the first boot draws on tty1. A password
# comes first as a menu of the same title (Generate or Manual), and the
# runner takes Manual.
questions:
  - id: root_password
    hook: 30rootpass
    prompt: Root Password
    answer: secret:root
  # bin/dbpass.py: the password of the MariaDB account admin
  - id: db_password
    hook: 35mysqlpass
    prompt: MariaDB password
    answer: secret:db
  # The Mode screen of decision 0076, the first step of 75keel-role.
  # Simple is its first entry. A described installation.mode skips it. A
  # node's answer of the id mode replaces this question in a cloud pass.
  - id: mode
    hook: 75keel-role
    prompt: Installation mode
    type: choice
    answer: '{ret}'
  - id: alert_email
    hook: 85secalerts
    prompt: System Notifications
    answer: admin@example.org
# keel/instance.example.yaml of this repository, with the secrets of the
# run and no instance name: the machine keeps the name pct create gave it
instance:
  version: 1
  network:
    managed_by: host
    interfaces:
      eth0:
        ipv6:
          method: auto
  tls:
    acme:
      enabled: false
  appliance:
    name: mariadb
  installation:
    mode: simple
  overlays:
    installer: enabled
    wireguard: disabled
    etcd: disabled
    crowdsec: disabled
    vip: disabled
  secrets:
    root_password: secret:root
    db_password: secret:db
  app:
    options:
      db_user: admin
  hub:
    api_key: skip
  security:
    alerts: admin@example.org
    updates_at_first_boot: skip
  first_login_wizard: false
proofs:
  - {secret: root, kind: shadow, user: root}
  # a TCP login of admin on the two loopback hosts that 35mysqlpass sets;
  # the hook verifies the password on ::1
  - {secret: db, kind: mysql, user: admin, host: '::1'}
  - {secret: db, kind: mysql, user: admin, host: 127.0.0.1}
services: [mariadb, webmin, cron, postfix, ssh, monit]
urls:
  - {url: 'https://127.0.0.1:12321/', status: 200}
forbidden:
  # a database layer serves no web page of its own
  - {kind: path, name: /etc/nginx}
  # Adminer and its first boot hook stay out of this layer (conf.d/main)
  - {kind: hook, name: 35adminer-mysqlpass}
  # the build tools of the layer stay on the build host (conf.d/main)
  - {kind: path, name: /usr/local/lib/keel-build}
  # the test database of a MariaDB installation: common's conf/mysql
  # removes it, and an image must not carry one
  - {kind: mysql-database, name: test}
# The web pages of the gallery (decision 0077): Webmin before and after the
# login with the root secret, and its MariaDB module (webmin-mysql) after it.
screenshots:
  - name: webmin
    port: 12321
    url: /
    login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
    # the dashboard of Webmin draws after the login (keel-postgresql, a
    # busy VM of BR2, 2026-11-06)
    wait: 20
  # the browser keeps the Webmin session of the shot before
  - {name: webmin-mysql, port: 12321, url: /mysql/, wait: 8}
# The cloud modes (decision 0076): MariaDB is a replicating engine, the
# pair of decisions 0031 and 0049, with semi-synchronous replication over
# TLS and GTID. The prompts are the titles of the confconsole screens, the
# shape of the contracts of keel-lnmp and keel-postgresql. The single node
# passes do not read this part. A database layer has no site files, so
# there is no Syncthing check.
cloud:
  capture:
    # keel1: an invite without a VIP, keel2: one that carries it (keel 0.23.83)
    invite: 'keel[12]:[A-Za-z0-9_.~+/=-]+'
    # the label anchors it: the usage screen shows the node's own addresses too
    vip: 'VIP:? +([0-9a-f]{1,4}(:[0-9a-f]{0,4}){2,7})'
  # the screens on which a node waits for another: no key while they are up
  waits: [Waiting for the nodes]
  # The proofs across the pair, in order. modes: a check runs only in the
  # cloud modes it names; a check without modes runs in both
  # (keel-commission of Keel-Linux/.github).
  #
  # No check compares first boot data of the two nodes, as the seeded
  # check of keel-lnmp does: a MariaDB layer writes no schema at its first
  # boot, and the admin account has the same hash on both nodes because
  # the pair shares the secret. So that check cannot tell a seeded replica
  # from one that is not seeded.
  checks:
    - {id: mesh-peer, at: all, run: 'keel mesh status', match: 'peers: 2', count: 3, modes: [cloud_advanced]}
    - {id: voters, at: all, run: 'keel mesh status --json | grep -o "\"healthy_voters\": *[0-9]*"', match: ': *3$', count: 3, modes: [cloud_advanced]}
    - {id: vip-holder, at: all, run: 'keel vip status', match: 'carried here: yes', count: 1}
    - {id: witness-no-data, at: witness, run: 'test ! -e /usr/sbin/mariadbd && echo nodata', match: '^nodata$', modes: [cloud_advanced]}
    # 3306 is a mesh port (the manifest's expose: mesh): the server listens
    # on named addresses only, never on a wildcard address that includes
    # the uplink (#29)
    - {id: no-wildcard-3306, at: 'primary,replica', run: 'l=$(ss -Hltn "sport = :3306"); test -n "$l" || exit 1; grep -Eq "(^|[[:space:]])(\*|0\.0\.0\.0|\[::\]):3306([[:space:]]|$)" <<< "$l" && echo wildcard || echo named', match: '^named$'}
    # the replica follows the primary with GTID, both threads running, and
    # takes no write of its own
    - {id: replica-replicates, at: replica, run: 'for i in $(seq 30); do s=$(mysql -e "SHOW SLAVE STATUS\\G"); grep -q "Slave_IO_Running: Yes" <<< "$s" && grep -q "Slave_SQL_Running: Yes" <<< "$s" && grep -q "Using_Gtid: Slave_Pos" <<< "$s" && echo replicating && exit 0; sleep 2; done; exit 1', match: '^replicating$'}
    - {id: replica-read-only, at: replica, run: 'mysql -N -e "SELECT @@global.read_only"', match: '^1$'}
    # the primary waits for the replica's acknowledgement (decision 0031)
    - {id: semi-sync-client, at: primary, run: 'mysql -N -e "SHOW GLOBAL STATUS LIKE \"Rpl_semi_sync_master_clients\""', match: '_clients[^0-9]+1$'}
    - {id: row-written, at: primary, run: 'mysql -e "CREATE DATABASE IF NOT EXISTS kc_probe; CREATE TABLE IF NOT EXISTS kc_probe.t (v INT); INSERT INTO kc_probe.t VALUES (42)"'}
    - {id: row-replicated, at: replica, run: 'sleep 5; mysql -N -e "SELECT v FROM kc_probe.t"', match: '^42$'}
    # the two nodes are at the same GTID position: the replica applied all
    # that the primary logged, and logged nothing of its own
    - {id: same-position, at: 'primary,replica', run: 'mysql -N -e "SELECT @@global.gtid_current_pos"', same: true}
    # The semi-synchronous fallback with an alert (decision 0031, kept on
    # 2026-11-01). Monit and the replica's keel-database-watch.timer stop
    # first: the manifest's Monit check restarts the server, and the
    # watch's follow starts a replica's server that does not answer. With
    # no replica connected the primary waits for nobody
    # (rpl_semi_sync_master_wait_no_slave OFF), and its next watch run,
    # every 30 s, sends "semi-synchronous replication fell back to
    # asynchronous" (keel.system.dbwatch). That alert does not wait for a
    # write, so the alert is on this check: the alert check of the write
    # starts after the stop, and the alert can come before that start.
    - {id: standby-stopped, at: replica, run: 'systemctl stop monit keel-database-watch.timer keel-database-watch.service; systemctl stop mariadb; systemctl is-active mariadb || echo stopped', match: 'stopped', alert: fell back to asynchronous, within: 120, modes: [cloud_simple]}
    # a write on the primary finishes without the replica; the bound is
    # more than the semi-synchronous timeout of 30 s
    - {id: write-without-standby, at: primary, run: 'timeout 90 mysql -e "CREATE TABLE IF NOT EXISTS kc_probe.async (v INT); INSERT INTO kc_probe.async VALUES (1)" && echo written', match: '^written$', modes: [cloud_simple]}
    # the server starts again and replicates again by itself: keel sets no
    # skip_slave_start
    - {id: standby-back, at: replica, run: 'systemctl start mariadb; systemctl start keel-database-watch.timer monit; for i in $(seq 60); do s=$(mysql -e "SHOW SLAVE STATUS\\G" 2>/dev/null); grep -q "Slave_IO_Running: Yes" <<< "$s" && grep -q "Slave_SQL_Running: Yes" <<< "$s" && echo replicating && exit 0; sleep 3; done; exit 1', match: '^replicating$', modes: [cloud_simple]}
    - {id: async-row-replicated, at: replica, run: 'for i in $(seq 30); do v=$(mysql -N -e "SELECT count(*) FROM kc_probe.async" 2>/dev/null); [ "$v" = 1 ] && break; sleep 2; done; echo $v', match: '^1$', modes: [cloud_simple]}
    # a planned promote of the replica, and the old primary that rejoins it
    - {id: promote, at: replica, run: 'keel vip promote'}
    - {id: promoted-holder, at: replica, run: 'keel vip status', match: 'carried here: yes'}
    - {id: promoted-writable, at: replica, run: 'for i in $(seq 30); do r=$(mysql -N -e "SELECT @@global.read_only"); [ "$r" = 0 ] && break; sleep 2; done; echo $r', match: '^0$'}
    # the old primary replicates from the new one and has applied all it
    # received before it takes the VIP back: a return promote before that
    # can leave no writable server or split the data (keel 0.23.84,
    # keel-lnmp BR1 and BR2)
    - {id: old-primary-follows, at: primary, run: 'for i in $(seq 60); do s=$(mysql -e "SHOW SLAVE STATUS\\G"); grep -q "Slave_SQL_Running: Yes" <<< "$s" && grep -q "Seconds_Behind_Master: 0" <<< "$s" && grep -q "has read all relay log" <<< "$s" && echo caught-up && exit 0; sleep 5; done; exit 1', match: '^caught-up$'}
    - {id: old-primary-read-only, at: primary, run: 'mysql -N -e "SELECT @@global.read_only"', match: '^1$'}
    - {id: return, at: primary, run: 'keel vip promote'}
    - {id: returned-holder, at: primary, run: 'keel vip status', match: 'carried here: yes'}
    - {id: returned-writable, at: primary, run: 'for i in $(seq 30); do r=$(mysql -N -e "SELECT @@global.read_only"); [ "$r" = 0 ] && break; sleep 2; done; echo $r', match: '^0$'}
    - {id: probe-dropped, at: primary, run: 'for i in $(seq 30); do mysql -e "DROP DATABASE kc_probe" 2>/dev/null && exit 0; sleep 2; done; exit 1'}
    # no unit failed on any node
    - {id: no-failed-units, at: all, run: 'systemctl --failed --no-legend --plain | wc -l', match: '^0$'}
nodes:
  - name: primary
    site: br1
    mode: cloud_simple
    role: primary
    # the hotkeys of the menus (the first letter of an item): an arrow key is
    # an escape sequence, and the console of a container can hand dialog its
    # ESC alone, which cancels the screen (BR1, 2026-11-06)
    answers:
      - {id: mode, prompt: Installation mode, keys: 'C{ret}'}
      - {id: role, prompt: Role of this node, keys: 'P{ret}'}
      - {id: invite, prompt: Invite a node, keys: '{ret}'}
  - name: replica
    site: br2
    mode: cloud_simple
    role: replica
    answers:
      - {id: mode, prompt: Installation mode, keys: 'C{ret}'}
      - {id: role, prompt: Role of this node, keys: 'R{ret}'}
      - {id: join, prompt: Join a mesh, keys: '{invite:1}{ret}'}
  # cloud advanced (decision 0076): the primary and the Keel Core witness
  # on BR1, the replica on BR2 while BR3 is down. The names differ from the
  # nodes of cloud simple: a record names each check NODE:CHECK.
  - name: adv-primary
    site: br1
    mode: cloud_advanced
    role: primary
    answers:
      - {id: mode, prompt: Installation mode, keys: 'CC{ret}'}
      - {id: role, prompt: Role of this node, keys: 'P{ret}'}
      - {id: invite, prompt: Invite a node, keys: '{ret}'}
      - {id: invite2, prompt: Invite a node, keys: '{ret}'}
  - name: adv-replica
    site: br2
    mode: cloud_advanced
    role: replica
    answers:
      - {id: mode, prompt: Installation mode, keys: 'CC{ret}'}
      - {id: role, prompt: Role of this node, keys: 'R{ret}'}
      - {id: join, prompt: Join a mesh, keys: '{invite:1}{ret}'}
  - name: witness
    site: br1
    mode: cloud_advanced
    role: witness
    # the witness is a node of keel-core, with the contract of keel-core
    # (a copy of its tests/commission.yaml): the image of keel-core is a new
    # build for each release, so the run gives it as KC_IMAGE_WITNESS
    contract: commission-core.yaml
    answers:
      - {id: mode, prompt: Installation mode, keys: 'CC{ret}'}
      - {id: role, prompt: Role of this node, keys: 'W{ret}'}
      - {id: join, prompt: Join a mesh, keys: '{invite:2}{ret}'}
