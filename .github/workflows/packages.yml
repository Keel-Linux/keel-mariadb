# The keel-mariadb package of packages/keel-mariadb (handbook decision
# 0041; issue #25). The check is "packages / build".
#
# The package is built, source and binary, with dpkg-buildpackage and
# linted with lintian, any error or warning failing, on trixie, the
# release it is for; then tests/package.bats builds it again and reads back
# its fields, its files and the manifest. Nothing is signed or published:
# publishing is the maintainer's attended release (Keel-Linux/apt,
# docs/build-host.md), and the layer's build installs the package from the
# Keel archive (plan/main). What the package does on a machine, the
# manifest validating and resolving along its chain, is proven at the
# layer's build (conf.d/main runs keel manifest validate on the tree) and
# on the booted image (tests/README.md, "The package on a built image").
#
# The job runs in a Debian trixie system container, an unprivileged LXC
# container with its own systemd on the self-hosted runner keel-lxc-1,
# through the reusable workflow lxc-trixie.yml of Keel-Linux/.github, as
# keel-core's does. Keel runs no application containers in CI. A pull
# request from a fork never reaches the self-hosted runner, so it gets no
# build, lint or package.bats result here.
name: packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    uses: keel-linux/.github/.github/workflows/lxc-trixie.yml@main
    with:
      timeout: 15
      artifact-dir: dist
      artifact-name: keel-mariadb-deb
      run: |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          ca-certificates git build-essential debhelper lintian bats \
          python3-yaml
        work="$(mktemp -d)"
        cp -a packages/keel-mariadb "$work/src"
        (cd "$work/src" && dpkg-buildpackage -us -uc)
        lintian --fail-on error,warning --info --display-info \
          "$work"/keel-mariadb_*.changes
        mkdir -p dist
        cp "$work"/*.deb "$work"/*.dsc "$work"/*.tar.* "$work"/*.changes dist/
        bats tests/package.bats
