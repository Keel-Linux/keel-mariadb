# The keel-mariadb package of packages/keel-mariadb (handbook decision
# 0041; issue #25). The check is "packages / build".
#
# The package is built, source and binary, with dpkg-buildpackage and
# linted with lintian, any error or warning failing, on trixie, the
# release it is for; then tests/package.bats builds it again and reads back
# its fields, its files and the manifest. Nothing is signed or published:
# publishing is the maintainer's attended release (Keel-Linux/apt,
# docs/build-host.md), and the layer's build installs the package from the
# Keel archive (plan/main). What the package does on a machine, the
# manifest validating and resolving along its chain, is proven at the
# layer's build (conf.d/main runs keel manifest validate on the tree) and
# on the booted image (tests/README.md, "The package on a built image").
#
# The job runs in a Debian trixie system container, an unprivileged LXC
# container with its own systemd on the self-hosted runner keel-lxc-1,
# through the reusable workflow lxc-trixie.yml of Keel-Linux/.github, as
# keel-core's does. Keel runs no application containers in CI. A pull
# request from a fork never reaches the self-hosted runner, so it gets no
# build, lint or package.bats result here.
name: packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    uses: keel-linux/.github/.github/workflows/lxc-trixie.yml@main
    with:
      timeout: 15
      artifact-dir: dist
      artifact-name: keel-mariadb-deb
      run: |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          ca-certificates git build-essential debhelper lintian bats \
          python3-yaml
        work="$(mktemp -d)"
        cp -a packages/keel-mariadb "$work/src"
        (cd "$work/src" && dpkg-buildpackage -us -uc)
        lintian --fail-on error,warning --info --display-info \
          "$work"/keel-mariadb_*.changes
        mkdir -p dist
        cp "$work"/*.deb "$work"/*.dsc "$work"/*.tar.* "$work"/*.changes dist/
        bats tests/package.bats
  appliance:
    # The boot test (org-plan section 1): the mariadb layer is fetched from
    # https://mirror.keellinux.org/layers, verified, assembled into a
    # scratch rootfs, booted in LXC and checked by tests/boot-test.sh.
    # Nothing of the layer is built there; the build host publishes it
    # (docs/releases-host.md of the keel repository). Before the first boot
    # the rootfs is upgraded from the archive and the keel-mariadb package
    # the build job made from this branch is installed over it
    # (package_artifact; bin/unprivileged-lxc of keel-linux/.github). So
    # what boots is the published layer, upgraded, with this branch's
    # package; a change of conf.d/main or of the overlay is not exercised
    # until a layer built from it is published.
    #
    # The job is here, not in tests.yml, because an artifact is visible
    # only inside the workflow run that uploaded it. Its id is still
    # "appliance", so the check is still "appliance / boot-published-layer",
    # a required status on main.
    #
    # test-appliance.yml targets the labels "self-hosted, keel-lxc"; a job
    # aimed at a label no runner carries stays queued until GitHub cancels
    # it after 24 hours, so the reusable workflow's contract is that
    # callers gate on the organization variable KEEL_LXC_RUNNER
    # (docs/ci-cd.md section 5 of the keel repository). A layer that has
    # never been published fails this job instead of passing it; this layer
    # is published, so allow_unpublished is not used here.
    needs: build
    if: vars.KEEL_LXC_RUNNER == 'true'
    uses: keel-linux/.github/.github/workflows/test-appliance.yml@main
    with:
      appliance: mariadb
      # A layer on core; the workflow checks this against the parent the
      # published manifest records.
      parent: core
      # Two containers on one bridge, one per role, so the boot test can
      # prove replication and not only that a single machine comes up.
      # Handbook decision 0013 makes a test like this the condition for
      # building the console's replication modes at all. The count is the
      # number of names, so Galera's three later is another name here and
      # nothing in the workflow or the test assumes two.
      roles: primary replica
      # The artifact of the build job above: the keel-mariadb package of
      # this branch, with its preset and its maintainer scripts (#29).
      package_artifact: keel-mariadb-deb
      timeout: 60
