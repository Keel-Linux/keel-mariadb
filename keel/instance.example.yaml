# Instance description of a MariaDB appliance, IPv6 first (docs/spec.md in
# the keel repository). Copy to /etc/keel/instance.yaml and create the two
# secret files (mode 0600, owned by root) before the first boot:
#
#   /etc/keel/secrets/root_password
#   /etc/keel/secrets/db_password     the MariaDB 'admin' account
#
# secrets.db_password is what reaches the database. Leave it out and the
# first boot has nothing to set the account with: on a first boot nobody can
# answer (a container nobody is attached to) firstboot.d/35mysqlpass asks
# nothing, says so in the inithooks log, and the account stays unable to
# authenticate, which is the state conf.d/main published it in, until the
# password is declared here or keel-init asks it at a console.
version: 1

instance:
  hostname: mariadb
  fqdn: mariadb.example.org

network:
  # LXC: the host owns eth0 and the address comes by SLAAC from the host's
  # /64. Switch to method static with an address once a DNS record points
  # at it, so the address the record names never moves.
  managed_by: host
  interfaces:
    eth0:
      ipv6:
        method: auto

tls:
  acme:
    # The database speaks its own protocol on 3306 and this layer serves no
    # web page of its own. Webmin, on 12321, carries its own certificate.
    enabled: false

# The appliance manifest the image ships, /usr/share/keel/appliances/
# mariadb.yaml (packages/keel-mariadb, handbook decision 0041), and this
# machine's choices against it: the installation mode chosen once, and every
# overlay of the chain written out (0027), here at the manifest's defaults
# for a simple installation. A pair, primary and replica on the mesh with
# the primary holding the pair's VIP, adds appliance.vip and database.server
# in a cloud mode: docs/replication.md in the keel repository.
appliance:
  name: mariadb
installation:
  mode: simple
overlays:
  installer: enabled
  wireguard: disabled
  etcd: disabled
  crowdsec: disabled
  vip: disabled

secrets:
  root_password:
    file: /etc/keel/secrets/root_password
  db_password:
    file: /etc/keel/secrets/db_password

app:
  options:
    # An option the manifest declares (default admin): renders to
    # APP_DB_USER, the account firstboot.d/35mysqlpass sets the password of.
    db_user: admin

hub:
  api_key: skip

security:
  alerts: skip
  updates_at_first_boot: skip

first_login_wizard: false
